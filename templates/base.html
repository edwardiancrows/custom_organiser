<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Eli's planner{% endblock %}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='cloud_icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="frame">
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-text">Eli's <em>Organiser</em></span>
    </a>
    <nav class="site-nav">
      <a href="{{ url_for('todo_page') }}" class="site-nav-link {{ 'active' if request.endpoint == 'todo_page' else '' }}">To-do</a>
      <a href="{{ url_for('index') }}" class="site-nav-link {{ 'active' if request.endpoint == 'index' else '' }}">Finances</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Nothing to see here.</span>
  </footer>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
